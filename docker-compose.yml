services:
  l1-portal:
    build:
      context: .
      dockerfile: services/l1-portal/Dockerfile
    restart: unless-stopped
    expose:
      - "8000"
    ports:
      - "8000:8000"
    environment:
      - SERVICE_NAME=l1-portal
      - MALLOC_ARENA_MAX=2
      - HXCTF_REQUIRE_TRACE=${HXCTF_REQUIRE_TRACE:-0}
      - DEPLOY_SECRET=${DEPLOY_SECRET:-}
      - VIEW_SALT=${VIEW_SALT:-}
      - FLAG_BROKER_URL=${FLAG_BROKER_URL:-http://flag-broker:8100}
      - PORT=8000
    volumes:
      - ${DYNAMIC_FLAG_PATH_2}:/answers/flag02:ro
      - ${DYNAMIC_FLAG_PATH_3}:/answers/flag03:ro
    networks:
      - n1
    healthcheck:
      test: ["CMD-SHELL", "python3 -c \"import urllib.request;urllib.request.urlopen('http://127.0.0.1:8000/healthz',timeout=3)\""]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 5s
    deploy:
      resources:
        limits:
          cpus: "0.20"
          memory: 128M
  l1-sso:
